<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>后台登录 - 彩虹仓</title>
  <link href="/static/vendor/bootstrap/bootstrap.min.css?v=5.3.0" rel="stylesheet">
  <link href="/static/vendor/fontawesome/css/all.min.css?v=6.4.0" rel="stylesheet">
  <link href="/static/css/style.css" rel="stylesheet">
  <style>
    body.sk-login {
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      padding: 24px;
      background:
        radial-gradient(1200px 500px at 10% -10%, rgba(59,130,246,.25), transparent 55%),
        radial-gradient(900px 400px at 100% 0%, rgba(16,185,129,.18), transparent 50%),
        #0f172a;
      font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .sk-login-card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      border: 1px solid #e4e4e7;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(2,6,23,.25);
      padding: 28px;
    }
    .sk-login-mark {
      width: 48px; height: 48px; border-radius: 12px;
      display:grid; place-items:center; margin: 0 auto 12px;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8); color:#fff;
    }
    .sk-login-title { text-align:center; font-weight:600; color:#1e293b; letter-spacing:-.02em; }
    .sk-login-sub { text-align:center; color:#71717a; font-size:13px; margin-bottom: 18px; }
    .form-control {
      background:#f4f4f5; border:1px solid transparent; border-radius:10px; min-height:44px;
    }
    .form-control:focus {
      background:#fff; border-color: rgba(59,130,246,.35);
      box-shadow: 0 0 0 .15rem rgba(59,130,246,.18);
    }
    .btn-login {
      min-height: 44px; border-radius: 10px; font-weight: 600;
      background:#3b82f6; border-color:#3b82f6;
    }
    .btn-login:hover { background:#2563eb; border-color:#2563eb; }
  </style>
</head>
<body class="sk-login">
  <script src="/static/js/order_filter_state.js?v=20261018-session-v1"></script>
  <div class="sk-login-card">
    <div class="sk-login-mark"><i class="fas fa-robot"></i></div>
    <h1 class="h4 sk-login-title mb-1">彩虹仓</h1>
    <div class="sk-login-sub">Fixed Sidebar Admin · 请登录后继续</div>

    {% if error %}
    <div class="alert alert-danger py-2">{{ error }}</div>
    {% endif %}

    <form method="post" action="/login" autocomplete="off">
      <input type="hidden" name="next" value="{{ next or '/admin' }}">
      <div class="mb-3">
        <label class="form-label">账号</label>
        <input type="text" class="form-control" name="username" value="{{ username or '' }}" required autofocus>
      </div>
      <div class="mb-4">
        <label class="form-label">密码</label>
        <input type="password" class="form-control" name="password" required>
      </div>
      <button type="submit" class="btn btn-primary btn-login w-100">
        <i class="fas fa-sign-in-alt me-1"></i> 登录后台
      </button>
    </form>
  </div>
</body>
</html>
