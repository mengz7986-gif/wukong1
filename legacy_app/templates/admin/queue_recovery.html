{% extends "base.html" %}
{% block title %}待处理中心{% endblock %}
{% block page_heading %}待处理中心{% endblock %}
{% block content %}
<div class="sk-page-header"><div><h1>客户待确认</h1><p class="text-muted mb-0">仅显示仍可操作的客户确认与失败来源；已关闭、已过期及纯诊断记录不会出现在这里。</p></div><button class="btn btn-outline-primary" onclick="loadRecovery(1)">刷新</button></div>
<div id="pendingCounts" class="d-flex flex-wrap gap-2 my-3"></div>
<form id="pendingFilters" class="row g-2 align-items-end mb-3" onsubmit="event.preventDefault();loadRecovery(1)">
 <div class="col-12 col-md-3"><label class="form-label">可操作状态</label><select class="form-select" id="pendingCategory"><option value="actionable" selected>等待客户点击</option><option value="failed">处理失败／等待重试</option></select></div>
 <div class="col-6 col-md-2"><label class="form-label">用户</label><input class="form-control" id="pendingUser" placeholder="ID / 名称"></div>
 <div class="col-6 col-md-2"><label class="form-label">来源群</label><input class="form-control" id="pendingChat" placeholder="群 ID"></div>
 <div class="col-6 col-md-2"><label class="form-label">开始（北京时间）</label><input class="form-control" id="pendingStart" placeholder="YYYY-MM-DD HH:mm:ss"></div>
 <div class="col-6 col-md-2"><label class="form-label">结束（北京时间）</label><input class="form-control" id="pendingEnd" placeholder="YYYY-MM-DD HH:mm:ss"></div>
 <div class="col-12 col-md-1"><button class="btn btn-primary w-100">查询</button></div>
</form>
<div id="recoveryStatus" role="status" aria-live="polite"></div>
<div class="sk-table-wrap"><table class="table align-middle"><thead><tr><th>类型</th><th>来源／用户</th><th>内容</th><th>待处理／错误</th><th>更新时间</th><th>操作</th></tr></thead><tbody id="recoveryRows"></tbody></table></div>
<nav class="d-flex justify-content-between align-items-center"><button class="btn btn-outline-secondary" id="pendingPrev" onclick="loadRecovery(currentPage-1)">上一页</button><span id="pendingPage"></span><button class="btn btn-outline-secondary" id="pendingNext" onclick="loadRecovery(currentPage+1)">下一页</button></nav>
<div class="border rounded p-3 mt-3" id="recoveryPreview" hidden><p id="recoveryExplanation"></p><label class="form-label">恢复理由（必填）</label><textarea class="form-control" id="recoveryReason" maxlength="500"></textarea><button id="recoverySubmit" class="btn btn-warning mt-2" onclick="applyRecovery()">确认本条恢复</button></div>
{% endblock %}
{% block scripts %}
<script>
const queueCsrf={{ queue_csrf|tojson }};let recoveryRows=[],recoveryPreview=null,recoveryKey=null,recoveryBusy=false,currentPage=1,currentTotal=0,pageSize=25;
function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function filters(page){return {category:$('#pendingCategory').val(),user:$('#pendingUser').val().trim(),chat:$('#pendingChat').val().trim(),start:$('#pendingStart').val().trim(),end:$('#pendingEnd').val().trim(),page:page,page_size:pageSize};}
function loadRecovery(page){if(page<1)return;$('#recoveryStatus').text('正在读取当前筛选范围…');$.get('/api/admin/queue-recovery',filters(page),function(result){currentPage=result.page;currentTotal=result.total;recoveryRows=result.rows;const labels={actionable:'等待客户点击',failed:'失败待处理'};const visibleCounts=['actionable','failed'].filter(k=>Object.prototype.hasOwnProperty.call(result.counts,k)).map(k=>'<span class="badge text-bg-light">'+labels[k]+' '+Number(result.counts[k])+'</span>');$('#pendingCounts').html(visibleCounts.join(''));$('#recoveryRows').html(result.rows.map(rowHtml).join('')||'<tr><td colspan="6">当前没有符合条件的可操作项。</td></tr>');$('#pendingPage').text('第 '+currentPage+' 页，共 '+currentTotal+' 条');$('#pendingPrev').prop('disabled',currentPage<=1);$('#pendingNext').prop('disabled',currentPage*pageSize>=currentTotal);$('#recoveryStatus').text('');}).fail(xhr=>$('#recoveryStatus').text(xhr.responseJSON?.detail||'读取失败。'));}
function waitText(seconds){seconds=Number(seconds||0);if(seconds<60)return seconds+'秒';if(seconds<3600)return Math.floor(seconds/60)+'分钟';return Math.floor(seconds/3600)+'小时'+Math.floor(seconds%3600/60)+'分钟';}
function rowHtml(r,i){const items=(r.items||[]).map(x=>escapeHtml(x.name)+' ×'+escapeHtml(x.quantity||'?')).join('、');let action=r.kind==='source_job'?'<button class="btn btn-sm btn-outline-primary" onclick="previewRecovery('+i+')">逐条核查</button>':'<button class="btn btn-sm btn-outline-danger" onclick="closeDraft('+i+')">关闭草稿</button>';if(r.message_link)action='<a class="btn btn-sm btn-primary me-1" target="_blank" rel="noopener" href="'+escapeHtml(r.message_link)+'">打开提示消息</a>'+action;const expiry=Number(r.remaining_seconds)>=0?' · 剩余 '+escapeHtml(waitText(r.remaining_seconds)):'';const prompt=r.receipt_message_id?'<div class="small text-muted">提示消息 #'+escapeHtml(r.receipt_message_id)+' · 已等待 '+escapeHtml(waitText(r.waiting_seconds))+expiry+'</div>':'';return '<tr><td><span class="badge text-bg-warning">'+escapeHtml(r.category_label)+'</span><div class="small text-muted">'+(r.kind==='draft'?'未提交草稿':'消息任务')+'</div></td><td>'+escapeHtml(r.chat_id)+' / '+escapeHtml(r.message_id)+'<div class="small">'+escapeHtml(r.user_name)+'</div>'+prompt+'</td><td>'+escapeHtml(r.summary||'-')+(items?'<div class="small text-muted">'+items+'</div>':'')+'</td><td>'+escapeHtml(r.pending||'-')+(r.error?'<div class="text-danger small">'+escapeHtml(r.error)+'</div>':'')+'</td><td>'+escapeHtml(r.updated_at)+'</td><td>'+action+'</td></tr>';}
function closeDraft(i){if(recoveryBusy)return;const r=recoveryRows[i];const reason=prompt('请填写关闭原因（必填，不会取消正式订单）：','');if(!reason||!reason.trim())return;if(!confirm('确认关闭该未提交草稿？已生成正式订单的来源会被系统拒绝。'))return;recoveryBusy=true;$.ajax({url:'/api/admin/pending-work/close-draft',method:'POST',contentType:'application/json',headers:{'X-Queue-CSRF':queueCsrf},data:JSON.stringify({token:r.token,version:r.version,reason:reason.trim(),operation_key:crypto.randomUUID()})}).done(()=>{loadRecovery(currentPage)}).fail(xhr=>$('#recoveryStatus').text(xhr.responseJSON?.detail||'草稿未关闭，请刷新核对。')).always(()=>recoveryBusy=false);}
function previewRecovery(i){if(recoveryBusy)return;const r=recoveryRows[i];$.get('/api/admin/queue-recovery/preview',{namespace:r.namespace,chat_id:r.chat_id,message_id:r.message_id},function(x){recoveryPreview=x;recoveryKey=crypto.randomUUID();$('#recoveryPreview').prop('hidden',false);$('#recoveryReason').val('');$('#recoveryExplanation').text(x.explanation+'（来源 '+x.chat_id+' / '+x.message_id+'）');$('#recoverySubmit').prop('disabled',x.action==='BLOCKED');}).fail(xhr=>$('#recoveryStatus').text(xhr.responseJSON?.detail||'核查失败；未重放来源。'));}
function applyRecovery(){if(recoveryBusy||!recoveryPreview)return;const reason=$('#recoveryReason').val().trim();if(!reason){$('#recoveryStatus').text('请填写恢复理由。');return}if(!confirm('确认仅处理这一条来源？不会从后台直接提交订单。'))return;recoveryBusy=true;let p={};['namespace','chat_id','message_id','action','version','issued_at','token'].forEach(k=>p[k]=recoveryPreview[k]);p.reason=reason;p.operation_key=recoveryKey;$.ajax({url:'/api/admin/queue-recovery/apply',method:'POST',contentType:'application/json',headers:{'X-Queue-CSRF':queueCsrf},data:JSON.stringify(p)}).done(()=>{recoveryPreview=null;$('#recoveryPreview').prop('hidden',true);loadRecovery(currentPage)}).fail(xhr=>$('#recoveryStatus').text(xhr.responseJSON?.detail||'结果待核对，请使用原操作编号重试。')).always(()=>recoveryBusy=false);}
$(function(){loadRecovery(1)});
</script>
{% endblock %}
