{% extends "base.html" %}

{% block title %}订单详情{% endblock %}

{% block content %}
<div class="d-flex justify-content-between flex-wrap flex-md-nowrap align-items-center pt-3 pb-2 mb-3 border-bottom">
    <h1 class="h2">
        <i class="fas fa-shopping-cart"></i> 订单详情
    </h1>
    <div class="btn-toolbar mb-2 mb-md-0">
        <button class="btn btn-primary me-2" onclick="copyOrderInfo()">
            <i class="fas fa-copy"></i> 复制订单信息
        </button>
        <a href="/admin/orders" class="btn btn-secondary">
            <i class="fas fa-arrow-left"></i> 返回列表
        </a>
    </div>
</div>

<div class="card">
    <div class="card-body" id="order-detail-content">
        <div id="loading" class="text-center">
            <div class="spinner-border" role="status">
                <span class="visually-hidden">加载中...</span>
            </div>
        </div>
        <div id="order-content" style="display: none;">
            <!-- 订单详情将通过JavaScript加载 -->
        </div>
    </div>
</div>

<!-- 复制成功提示 -->
<div class="position-fixed top-0 end-0 p-3" style="z-index: 1050">
    <div id="copyToast" class="toast" role="alert">
        <div class="toast-header bg-success text-white">
            <strong class="me-auto">复制成功</strong>
            <button type="button" class="btn-close" data-bs-dismiss="toast"></button>
        </div>
        <div class="toast-body">
            订单信息已复制到剪贴板！
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script src="/static/js/order_detail.js?v=328aba809b58d3af82031750dbd2560d83ab020c3c7242aeb252ffbe7eeb19b3"></script>
{% endblock %}
