limit_req_zone $binary_remote_addr zone=newbot_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=newbot_api:10m rate=20r/s;
server {
    listen 80;
    server_name admin.chdf888.com api.chdf888.com;
    return 301 https://$host$request_uri;
}
server {
    listen 443 ssl;
    server_name admin.chdf888.com;
    ssl_certificate /etc/letsencrypt/live/admin.chdf888.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.chdf888.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 10m;
    access_log /var/log/nginx/newbot-admin-access.log;
    error_log /var/log/nginx/newbot-admin-error.log warn;
    add_header Strict-Transport-Security "max-age=86400" always;
    location = /healthz {
        default_type application/json;
        return 200 '{"state":"backend-live","bot_enabled":false}';
    }
    location = /login {
        limit_req zone=newbot_login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/snippets/newbot-proxy.conf;
    }
    location / {
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/snippets/newbot-proxy.conf;
    }
}
server {
    listen 443 ssl;
    server_name api.chdf888.com;
    ssl_certificate /etc/letsencrypt/live/admin.chdf888.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.chdf888.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;
    client_max_body_size 10m;
    access_log /var/log/nginx/newbot-api-access.log;
    error_log /var/log/nginx/newbot-api-error.log warn;
    location = /healthz {
        default_type application/json;
        return 200 '{"state":"backend-live","bot_enabled":false}';
    }
    location /api/ {
        limit_req zone=newbot_api burst=40 nodelay;
        proxy_pass http://127.0.0.1:8765;
        include /etc/nginx/snippets/newbot-proxy.conf;
    }
    location / { return 404; }
}
