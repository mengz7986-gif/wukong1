server {
    listen 80;
    server_name admin.chdf888.com api.chdf888.com;
    server_tokens off;
    access_log /var/log/nginx/newbot-access.log;
    error_log /var/log/nginx/newbot-error.log warn;
    location = /healthz {
        default_type application/json;
        return 200 '{"state":"migration-pending","bot_enabled":false}';
    }
    location / {
        default_type text/plain;
        add_header Retry-After 3600 always;
        return 503 "Migration validation in progress. Business writes are not enabled.\n";
    }
}
