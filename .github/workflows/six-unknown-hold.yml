name: Exact six UNKNOWN safety isolated Linux
on:
  push:
    branches: [fix/exact-six-receipt-hold-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hold:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/four_specials_requirements.txt
      - name: Exact receipt holds, original reviews, concurrent failures and independent notices
        run: |
          mkdir -p test-results
          python -m pytest tests/test_six_unknown_hold.py tests/test_frozen_direct_receipts.py tests/test_exact_receipt_hold.py -q --disable-warnings --junitxml=test-results/six-hold.xml
          python -m pytest tests/test_four_specials_pipeline.py -k 'durable_duplicate or late_expired or concurrent_same_message or restart_never or restart_does_not_rearm or quantity_split' -q --disable-warnings --junitxml=test-results/affected-idempotency.xml
          python -m pytest tests/test_receipt_speed.py -k 'timeout_not_retried or direct_timeout or success_ack_followed or full_multipart or audit_failure_after_ack' -q --disable-warnings --junitxml=test-results/affected-receipts.xml
          echo 'Reuse b3631cb12 metrics/42fbd5730/2a7d13324 and dictionary51+503; no parser/order/inventory/accounting change.' > test-results/reused-evidence.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: six-unknown-hold-evidence
          path: test-results/
