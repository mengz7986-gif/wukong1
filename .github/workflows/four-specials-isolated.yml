name: Four specials isolated Linux regression
on:
  push:
    branches: [fix/four-specials-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install production-matched dependencies
        run: python -m pip install -r tests/four_specials_requirements.txt
      - name: Targeted regressions with synthetic databases
        run: |
          mkdir -p test-results
          python -m pytest tests/test_four_specials_regressions.py tests/test_four_specials_pipeline.py -q --junitxml=test-results/regressions.xml
          node --check legacy_app/static/js/brand_aliases.js
          node --check legacy_app/static/js/flavor_aliases.js
      - name: Extract sealed baseline
        run: |
          mkdir -p "$RUNNER_TEMP/four-specials-baseline"
          git archive 767492b0ca8a4d5eca641c3c91efedd62043e78b | tar -x -C "$RUNNER_TEMP/four-specials-baseline"
      - name: Before and after on the same isolated Linux runner
        run: |
          python tests/benchmark_four_specials.py --source "$RUNNER_TEMP/four-specials-baseline" --samples 40 --output "$GITHUB_WORKSPACE/test-results/linux-before.json"
          python tests/benchmark_four_specials.py --samples 40 --output "$GITHUB_WORKSPACE/test-results/linux-after.json"
      - name: Check candidate goals
        run: |
          python - <<'PY'
          import json
          d=json.load(open('test-results/linux-after.json'))
          assert d['parser']['p95_ms'] <= 2000, d['parser']
          assert d['persist_to_commit']['p95_ms'] <= 5000, d['persist_to_commit']
          assert d['fifo_stock_consistent'] and d['orders_committed']==40
          assert d['pool_checked_out']==0, d['pool_checked_out']
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: four-specials-linux-evidence
          path: test-results/
