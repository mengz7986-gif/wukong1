name: Committed API metrics atomic write isolated evidence
on:
  push:
    branches: [fix/api-metrics-write-20261102]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/four_specials_requirements.txt
      - name: Targeted statistics persistence and crash boundary regression
        run: |
          mkdir -p test-results
          python -m pytest tests/test_api_metrics_write.py -q --disable-warnings --junitxml=test-results/metrics.xml
          echo 'Reuse 30 checks from42fbd57 /41423559717 plus prior24 and dictionary51/503; unchanged business/claim/send paths.' > test-results/reused-evidence.txt
      - name: Before and after same two16-message bursts; simulated ACK only
        run: |
          mkdir -p "$RUNNER_TEMP/base-42"
          git archive 42fbd576a6d47286f4a3ab65e9d21e73746db868 | tar -x -C "$RUNNER_TEMP/base-42"
          for chats in 1 4; do
            python tests/benchmark_real_receipt_tail.py --source "$RUNNER_TEMP/base-42" --samples 16 --history 750 --queue-history 15500 --chats "$chats" --metrics-write-probe --output "$GITHUB_WORKSPACE/test-results/before-chat$chats.json"
            python tests/benchmark_real_receipt_tail.py --samples 16 --history 750 --queue-history 15500 --chats "$chats" --metrics-write-probe --output "$GITHUB_WORKSPACE/test-results/after-chat$chats.json"
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-metrics-write-evidence
          path: test-results/
