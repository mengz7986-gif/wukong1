name: Exact18086 cancellation isolated safety
on:
  push:
    branches: [codex/cancel18086-exact-hold-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cancel18086:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/four_specials_requirements.txt
      - name: Exact18086 and original15920, plus affected transport paths
        run: |
          mkdir -p test-results
          python -m pytest tests/test_cancel18086_hold.py tests/test_cancel_notice_hold.py -q --disable-warnings --junitxml=test-results/cancel18086.xml
          python -m pytest tests/test_recovery7_hold.py -k 'untagged_direct or context_without_reply or legal_new_messages' -q --disable-warnings --junitxml=test-results/affected-recovery-transport.xml
          python -m pytest tests/test_receipt_speed.py -k 'timeout_not_retried or direct_timeout or success_ack_followed or full_multipart or audit_failure_after_ack' -q --disable-warnings --junitxml=test-results/affected-receipt.xml
          git diff --exit-code 3dc6ed5 HEAD -- legacy_app/models.py legacy_app/execution_safety.py legacy_app/telegram_order_queue.py legacy_app/order_parser.py legacy_app/local_fulfillment.py legacy_app/frozen_direct_receipts.py legacy_app/p0_recovery_protection.py legacy_app/recovery_timeout_hold.py legacy_app/timeout_receipt_hold.py legacy_app/six_unknown_receipt_hold.py legacy_app/receipt_review_gate.py legacy_app/config.py legacy_app/success_receipt_audit.py legacy_app/api.py legacy_app/cancel_notice_worker.py legacy_app/account_notifications.py legacy_app/telegram_delivery_sync.py
      - name: Compatible rollback retains every independent hold; no DB restore
        run: |
          mkdir -p "$RUNNER_TEMP/rollback-fca8f15"
          git archive fca8f15 | tar -x -C "$RUNNER_TEMP/rollback-fca8f15"
          cp legacy_app/timeout_receipt_hold.py legacy_app/six_unknown_receipt_hold.py legacy_app/receipt_review_gate.py legacy_app/recovery_timeout_hold.py legacy_app/p0_recovery_protection.py legacy_app/telegram_delivery.py legacy_app/cancel_notice_hold.py "$RUNNER_TEMP/rollback-fca8f15/legacy_app/"
          cp tests/test_cancel18086_hold.py tests/test_cancel_notice_hold.py tests/test_recovery7_hold.py "$RUNNER_TEMP/rollback-fca8f15/tests/"
          python -m pytest "$RUNNER_TEMP/rollback-fca8f15/tests/test_cancel18086_hold.py" "$RUNNER_TEMP/rollback-fca8f15/tests/test_cancel_notice_hold.py" -q --disable-warnings --junitxml=test-results/rollback-cancel.xml
          python -m pytest "$RUNNER_TEMP/rollback-fca8f15/tests/test_recovery7_hold.py" -k 'untagged_direct or context_without_reply or legal_new_messages' -q --disable-warnings --junitxml=test-results/rollback-recovery-transport.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cancel18086-safety-evidence
          path: test-results/
