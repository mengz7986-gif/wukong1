name: Gaowei quantity boundary isolated Linux
on:
  push:
    branches: [codex/gaowei-quantity-boundary-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boundary:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/four_specials_requirements.txt
      - name: Targeted order boundary and existing affected regressions
        run: |
          mkdir -p test-results
          python -m pytest tests/test_gaowei_quantity_boundary.py -q --disable-warnings --junitxml=test-results/gaowei-boundary.xml
          python -m pytest tests/test_order_six_final.py -k 'empty_backup or two_sections or totals_do_not or concurrent_clicks or pending_confirmation_stock or flavor_confirmation_does_not or primary_choice_preserves or labelled_notes' -q --disable-warnings --junitxml=test-results/affected-order-boundaries.xml
          python -m pytest tests/test_four_specials_regressions.py -k 'explicit_category or exact_catalog or order_counts or preference_label or real_catalog_name' -q --disable-warnings --junitxml=test-results/affected-catalog-quantity.xml
          git diff --exit-code 0379ba5 HEAD -- legacy_app/six_unknown_receipt_hold.py legacy_app/cancel_notice_hold.py legacy_app/frozen_direct_receipts.py legacy_app/p0_recovery_protection.py legacy_app/receipt_review_gate.py legacy_app/success_receipt_audit.py legacy_app/models.py legacy_app/api.py legacy_app/telegram_order_queue.py legacy_app/telegram_queue_runtime.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gaowei-boundary-isolated-evidence
          path: test-results/
