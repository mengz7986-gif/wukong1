name: Unified warehouse JPEG layout
on:
  push:
    branches: [codex/inventory-unified-layout-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory-layout:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r tests/four_specials_requirements.txt
      - run: sudo apt-get update -qq && sudo apt-get install -y fonts-noto-cjk
      - name: Fixed JPEG, pagination, cache invalidation, existing senders and Web page selection
        run: |
          mkdir -p test-results
          python -m pytest tests/test_inventory_unified.py -q --disable-warnings --junitxml=test-results/inventory-unified.xml
          python - <<'PY'
          import re,subprocess,ast
          from pathlib import Path
          html=Path('legacy_app/templates/admin/inventory_image.html').read_text()
          js=re.search(r'<script>(.*?)</script>',html,re.S)[1]
          js=re.sub(r'{{.*?}}','null',js)
          Path('test-results/inventory-preview.js').write_text(js)
          subprocess.run(['node','--check','test-results/inventory-preview.js'],check=True)
          before=subprocess.check_output(['git','show','4b3e927:legacy_app/bot.py'],text=True)
          after=Path('legacy_app/bot.py').read_text()
          def rest(source):
              tree=ast.parse(source)
              for n in tree.body:
                  if isinstance(n,ast.ClassDef) and n.name=='OrderBot':
                      n.body=[m for m in n.body if not isinstance(m,(ast.FunctionDef,ast.AsyncFunctionDef)) or m.name not in ('_send_inventory_gallery','_send_inventory_preview_images')]
              return ast.dump(tree)
          assert rest(before)==rest(after),'UNRELATED_BOT_LOGIC_CHANGED'
          PY
          git diff --exit-code 4b3e927 HEAD -- legacy_app/models.py legacy_app/api.py legacy_app/config.py legacy_app/order_parser.py legacy_app/execution_safety.py legacy_app/telegram_order_queue.py legacy_app/p0_recovery_protection.py legacy_app/receipt_review_gate.py legacy_app/timeout_receipt_hold.py legacy_app/recovery_timeout_hold.py legacy_app/cancel_notice_hold.py legacy_app/telegram_delivery.py legacy_app/telegram_delivery_sync.py legacy_app/static/images/inventory-long-march-snow-v1.png legacy_app/static/images/inventory-founding-ceremony-v1.png legacy_app/static/images/inventory-waterlight-v1.png
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: inventory-unified-evidence
          path: test-results/
