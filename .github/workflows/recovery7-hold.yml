name: Seven recovery UNKNOWN isolated safety
on:
  push:
    branches: [codex/recovery7-exact-hold-20261103]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery7:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r tests/four_specials_requirements.txt
      - name: Exact seven, original P0, composed old safety and transport
        run: |
          mkdir -p test-results
          python -m pytest tests/test_recovery7_hold.py tests/test_exact_receipt_hold.py -q --disable-warnings --junitxml=test-results/recovery7.xml
          python -m pytest tests/test_timeout36_hold.py tests/test_six_unknown_hold.py tests/test_frozen_direct_receipts.py tests/test_cancel_notice_hold.py -q --disable-warnings --junitxml=test-results/composed-history.xml
          python -m pytest tests/test_receipt_speed.py -k 'timeout_not_retried or direct_timeout or success_ack_followed or full_multipart or audit_failure_after_ack' -q --disable-warnings --junitxml=test-results/affected-receipt.xml
          git diff --exit-code 5694d1f HEAD -- legacy_app/models.py legacy_app/execution_safety.py legacy_app/telegram_order_queue.py legacy_app/telegram_queue_runtime.py legacy_app/order_parser.py legacy_app/local_fulfillment.py legacy_app/frozen_direct_receipts.py legacy_app/cancel_notice_hold.py legacy_app/config.py legacy_app/success_receipt_audit.py legacy_app/api.py legacy_app/receipt_review_gate.py
      - name: Compatible rollback preserves six protection modules and all real data
        run: |
          mkdir -p "$RUNNER_TEMP/rollback-fca8f15"
          git archive fca8f15 | tar -x -C "$RUNNER_TEMP/rollback-fca8f15"
          cp legacy_app/timeout_receipt_hold.py legacy_app/six_unknown_receipt_hold.py legacy_app/receipt_review_gate.py legacy_app/recovery_timeout_hold.py legacy_app/p0_recovery_protection.py legacy_app/telegram_delivery.py "$RUNNER_TEMP/rollback-fca8f15/legacy_app/"
          cp tests/test_timeout36_hold.py tests/test_recovery7_hold.py tests/test_exact_receipt_hold.py "$RUNNER_TEMP/rollback-fca8f15/tests/"
          python -m pytest "$RUNNER_TEMP/rollback-fca8f15/tests/test_timeout36_hold.py" "$RUNNER_TEMP/rollback-fca8f15/tests/test_six_unknown_hold.py" "$RUNNER_TEMP/rollback-fca8f15/tests/test_frozen_direct_receipts.py" "$RUNNER_TEMP/rollback-fca8f15/tests/test_cancel_notice_hold.py" "$RUNNER_TEMP/rollback-fca8f15/tests/test_recovery7_hold.py" "$RUNNER_TEMP/rollback-fca8f15/tests/test_exact_receipt_hold.py" -q --disable-warnings --junitxml=test-results/compatible-rollback.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: recovery7-safety-evidence
          path: test-results/
